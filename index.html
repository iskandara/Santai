<body id="top">
<a class="skip" href="#collection">Skip to the collection</a>
<div id="cursor"></div>
<div class="grain"></div>
<div id="hold-layer"></div>

<div id="loading">
  <div class="loading-logo">SANTAI</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
</div>

<header class="site-header">
  <nav class="hdr-side left" aria-label="Primary">
    <a class="hdr-link" href="#collection">Collection</a>
    <a class="hdr-link" href="sizechart.html">Size chart</a>
  </nav>
  <h1 class="wordmark">
    <img class="logo-img" id="logoImg" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="150" height="32" alt="SANTAI">
    <span class="logo-text" id="logoText">SANTAI</span>
  </h1>
  <div class="hdr-side right">
    <a class="hdr-ig" data-ig href="https://instagram.com/santai.memorabilia" target="_blank" rel="noopener noreferrer" aria-label="SANTAI on Instagram">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
    </a>
    <a class="hdr-link hdr-order" href="#orderBand">Order</a>
  </div>
</header>

<main id="main">
  <div class="stage-msg" id="stageMsg" role="status">
    <p id="stageMsgText"></p>
    <button id="stageRetry" type="button" hidden>Try again</button>
  </div>

  <div class="marquee" id="marquee" hidden>
    <div class="marquee-track" id="marqueeTrack"></div>
    <button class="marquee-btn" id="motionBtn" type="button" aria-pressed="false">Pause</button>
  </div>

  <div class="collection" id="collection" tabindex="-1"></div>

  <section class="band" id="orderBand" aria-labelledby="orderTitle" hidden>
    <div class="band-grid">
      <h2 class="band-title" id="orderTitle">Order</h2>
      <div class="band-body">
        <p class="band-lede" id="bandHow"></p>
        <div class="band-actions">
          <a class="btn-inv" id="bandWa" href="https://wa.me/" target="_blank" rel="noopener noreferrer" hidden>Message on WhatsApp</a>
          <a class="btn-inv ghost" id="bandIg" href="https://ig.me/m/santai.memorabilia" target="_blank" rel="noopener noreferrer">Message on Instagram</a>
        </div>
      </div>
    </div>
    <div class="band-info" id="bandInfo" hidden>
      <div id="shipBlock" hidden><h3>Shipping</h3><p id="shipText"></p></div>
      <div id="retBlock" hidden><h3>Returns</h3><p id="retText"></p></div>
    </div>
    <div class="band-foot">
      <span>&copy; <span id="year"></span> SANTAI</span>
      <nav aria-label="Footer">
        <a href="sizechart.html">Size chart</a>
        <a data-ig href="https://instagram.com/santai.memorabilia" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="#top">Back to top</a>
      </nav>
    </div>
  </section>
</main>

<div class="mbar" id="mbar">
  <div class="mbar-text"><div class="mbar-name" id="mbarName"></div><div class="mbar-price" id="mbarPrice"></div></div>
  <button class="mbar-btn" id="mbarBtn" type="button">Order</button>
</div>

<noscript><p class="noscript-msg">SANTAI needs JavaScript to show the collection.</p></noscript>
